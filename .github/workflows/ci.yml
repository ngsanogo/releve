name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Neither uv's version nor Python's is written in this file. setup-uv installs
# the uv that pyproject.toml requires (`[tool.uv] required-version`), and uv
# installs the one Python .python-version names — the Python the image runs.

jobs:
  lint:
    name: lint · format · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests custom_components tests_ha
      - run: uv run ruff format --check src tests custom_components tests_ha
      - run: uv run mypy

  test:
    name: tests
    runs-on: ubuntu-latest
    env:
      MQTT_TEST_BROKER: 127.0.0.1:1883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start an MQTT broker
        # The same image as the Makefile's MQTT_IMAGE (a test holds them equal).
        run: docker run --detach --publish 127.0.0.1:1883:1883 eclipse-mosquitto:2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408 mosquitto -c /mosquitto-no-auth.conf
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

  home-assistant:
    name: Home Assistant integration · hassfest · HACS · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hassfest
        # Pin master tip, not tag 1.0.0 (that tag is the 2020 first commit and
        # cannot find script.hassfest). Dependabot must not "upgrade" this.
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master, 2026-09-27
      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # The domain is not in home-assistant/brands; everything else is checked.
          ignore: brands
          comment: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # Its own environment: Home Assistant pins libraries releve also locks.
      - run: |
          uv venv "$RUNNER_TEMP/ha"
          uv pip install --python "$RUNNER_TEMP/ha" -r tests_ha/requirements.txt
      - name: Types (mypy strict, against homeassistant)
        run: '"$RUNNER_TEMP/ha/bin/python" -m mypy --config-file tests_ha/mypy.ini custom_components/releve'
      - name: Tests against the pinned Home Assistant
        working-directory: tests_ha
        run: '"$RUNNER_TEMP/ha/bin/python" -m pytest'

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Audit the locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off

  package:
    name: wheel · clean install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Install the wheel alone and use it
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_STATE_HOME: ${{ runner.temp }}/state
          RELEVE_GATEWAY__TOKEN: not-a-real-token
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/releve-*.whl
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          releve version
          python -m releve version
          releve init
          releve check
          releve status
          test -f "$XDG_STATE_HOME/releve/releve.db"

  image:
    name: image (amd64 + arm64) · container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: releve:ci
          cache-from: type=gha
      - name: Serve with a configuration and wait until healthy
        run: |
          cat > "$RUNNER_TEMP/config.yaml" <<'YAML'
          gateway:
            token: not-a-real-token
            base_url: https://127.0.0.1:9
          usage_points:
            - id: "01234567890123"
          sync:
            rte_signals: false
          YAML
          chmod 644 "$RUNNER_TEMP/config.yaml"
          docker run --detach --name smoke --publish 127.0.0.1:8080:8080 \
            --volume "$RUNNER_TEMP/config.yaml:/home/app/config.yaml:ro" releve:ci
          for _ in $(seq 30); do
            if curl --silent --fail http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks at the version mise.toml names, verified against the checksum
      # mise.lock holds: the binary `make secrets` runs on a workstation.
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          install_args: gitleaks
      - name: Scan the working tree and the history
        run: gitleaks git --verbose --redact .
