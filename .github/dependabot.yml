version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The Home Assistant the integration is tested against (tests_ha/requirements.txt):
  # pytest-homeassistant-custom-component pins homeassistant, one release each.
  - package-ecosystem: "pip"
    directory: "/tests_ha"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # The image's interpreter moves WITH the tested CI matrix, never ahead of it.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
