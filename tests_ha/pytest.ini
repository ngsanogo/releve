# Separate from pyproject.toml's pytest settings: these tests run in their own
# environment (Python 3.14, homeassistant pinned by requirements.txt), never in
# releve's. From the repository root: pytest -c tests_ha/pytest.ini
[pytest]
testpaths = .
pythonpath = ..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# -p no:respx: Home Assistant installs its httpx alias before respx is imported
# (pytest-homeassistant's README).
addopts = -ra --strict-markers -p no:respx
