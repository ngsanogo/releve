# Tool pins only: `mise install` after a clone and after this file changes. The
# commands live in the Makefile (`make help`). Python is not here: uv installs
# the one .python-version names.
#
# uv is the uv of the Dockerfile and CI (setup-uv's `version`); gitleaks is what
# `make secrets` and CI scan with. Move the other mentions of these versions
# (Dockerfile, workflows, pyproject.toml's build backend, .pre-commit-config.yaml)
# together with this file, then `mise install && mise lock` (mise.lock holds the
# checksums for linux-arm64 and linux-x64).
#
# pyproject.toml has no `[tool.uv] required-version` on purpose: Dependabot's uv
# updater runs its own uv, and uv refuses any version but the required one.

# mise refuses to run below this version. CI's `jdx/mise-action` cannot read this
# line, so each of its steps repeats the number (a test holds them to it).
min_version = "2026.10.2"

[tools]
gitleaks = "8.30.1"
uv = "0.13.5"

[settings]
lockfile = true
