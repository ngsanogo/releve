# releve: example deployment.
#
#   docker run --rm ghcr.io/ngsanogo/releve:v0.3.1 init --stdout > config.yaml
#   chmod 600 config.yaml     # then set gateway.token and your usage point
#   docker compose up -d
#
# The image is pinned: an upgrade is a decision (see "Backup, restore, upgrade" in README.md).
services:
  releve:
    image: ghcr.io/ngsanogo/releve:v0.3.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /home/app/config.yaml
        read_only: true
        bind:
          create_host_path: false  # fail loudly instead of mounting an empty directory
      - data:/home/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
